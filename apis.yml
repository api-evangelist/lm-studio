aid: lm-studio
name: LM Studio
description: >-
  LM Studio is a desktop application for discovering, downloading, and running large
  language models (Llama, DeepSeek, Phi, Qwen, gpt-oss, and others) locally on macOS,
  Windows, and Linux. It runs GGUF and MLX models via llama.cpp and Apple's MLX engine,
  and ships a local HTTP server that developers can drive from their own apps: a native
  LM Studio REST API (beta) under /api/v1 with generation stats, model load/unload/download
  and MCP-via-API, an OpenAI-compatible surface under /v1 (chat/completions, completions,
  embeddings, models, responses), and an Anthropic-compatible /v1/messages endpoint. It is
  complemented by Python (lmstudio) and TypeScript (@lmstudio/sdk) SDKs, the MIT-licensed
  lms command-line tool, headless/daemon operation, LM Link cross-device routing, and MCP
  host support. Backed by Matrix Partners.
